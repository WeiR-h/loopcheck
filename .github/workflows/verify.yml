name: Verify LoopCheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      OTEL_SDK_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Unit and real browser tests (no provider calls)
        run: |
          set -o pipefail
          mkdir -p .test-data
          python -m unittest discover -s tests -v 2>&1 | tee .test-data/ci-tests.log
          node --check web/projects.js
          node --check web/requirements.js
      - name: Original budget regression gate
        run: python scripts/project_gate.py
      - name: Future requirements and MCP evidence gate
        run: |
          python scripts/cart_gate_v05.py
          python scripts/verify_mcp_v05.py
      - name: Frozen three-project benchmark
        run: |
          python run.py > .test-data/ci-server.log 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8791/health
          python scripts/evaluate_projects.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-verification
          path: |
            .test-data/ci-tests.log
            .test-data/ci-server.log
            docs/evidence/v05-benchmark.json
            docs/evidence/v05-frozen-cases.json
            docs/evidence/v05-cart-gate.json
            docs/evidence/v05-mcp.json
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release Dockerfile
        run: docker build -t loopcheck:ci .
      - name: Public container browser gate at 768 MiB
        run: python scripts/container_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: docs/evidence/v05-container-check.json
          retention-days: 30
